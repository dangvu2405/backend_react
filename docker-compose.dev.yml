version: '3.8'

# Docker Compose cho development environment
# Sử dụng: docker-compose -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: backend-api-dev
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI:-mongodb://admin:password@mongo:27017/perfume-shop-dev?authSource=admin}
      - SESSION_SECRET=dev-session-secret
      - JWT_SECRET=dev-jwt-secret
      - JWT_REFRESH_SECRET=dev-refresh-secret
      - FRONTEND_URL=http://localhost:5173
      - ENABLE_SWAGGER=true
      - MORGAN_ENABLED=true
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - backend-network
    command: npm run dev

  mongo:
    image: mongo:7.0
    container_name: backend-mongo-dev
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_DATABASE=perfume-shop-dev
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-password}
    volumes:
      - mongo-dev-data:/data/db
    networks:
      - backend-network

volumes:
  mongo-dev-data:
    driver: local

networks:
  backend-network:
    driver: bridge
